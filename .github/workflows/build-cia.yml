name: Build CIA

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-cia:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply local 3DS cleanup fixes
        run: git apply patches/moonlight-n3ds-local-fixes.patch

      - name: Apply moonlight-common exit fix
        run: git -C third_party/moonlight-common-c apply ../../patches/moonlight-common-exit-freeze.patch

      - name: Build Dockerfile
        run: docker build --network=host -t moonlight-n3ds .

      - name: Build CIA
        run: docker run --rm -v .:/moonlight-N3DS -w /moonlight-N3DS moonlight-n3ds:latest make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-exitfix
          path: |
            ./*.cia
            ./*.3dsx
